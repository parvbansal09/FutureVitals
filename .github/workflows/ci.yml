# The release rules from the product spec, run on every change:
#   reading level, copy length, bilingual parity, the 44 personas, every
#   screen agreeing with the answers, the build, end-to-end, accessibility,
#   and link liveness.
name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: '0 11 * * 1'   # Mondays: catches links and listings that went stale

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests (personas, risk, compare, scanner, parity)
        run: npm test
      - name: Content rules (grade 6, lengths, parity, freshness)
        run: npm run check:content
      - name: Build
        run: npm run build
      - name: End-to-end and network audit
        run: npm run e2e
      - name: Accessibility (44 px targets, axe-core WCAG 2.2 AA)
        run: npm run a11y
      - name: Links and phone numbers
        run: npm run check:links
