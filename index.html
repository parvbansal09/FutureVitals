<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#E5F1EE" />
    <meta name="description" content="Answer a few questions about your health and habits. See which cancer screenings may apply to you and where to find care nearby. Your answers stay on your phone." />
    <meta name="referrer" content="no-referrer" />
    <title>FutureVitals</title>
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preload" href="./fonts/tinos-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* Paints before the app loads, so the first frame is already on brand.
         The app opens light whatever the phone's setting. */
      html, body { margin: 0; background: #E5F1EE; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; }
      #boot img { width: 88px; height: 88px; opacity: .9; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot" aria-hidden="true">
        <img src="./icons/mark.svg" alt="" width="88" height="88" />
      </div>
    </div>
    <noscript>FutureVitals needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
